<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <div>
            <form>
    <table border="1">
        <caption><h1><b>Reserve Your Table</b></h1></caption>
        <tr>
            <td><label for="name">Full Name:</label></td>
            <td>
                <input type="text" id="name" name="name" placeholder="Enter your name">
            </td>
        </tr>
        <tr>
            <td><label for="phone">Phone Number:</label></td>
            <td>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
            </td>
        </tr>
        <tr>
            <td><label for="email">Email:</label></td>
            <td>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </td>
        </tr>
        <tr>
            <td><label for="guests">Number of Guests:</label></td>
            <td>
                <input type="number" id="guests" name="guests" min="1" max="20">
            </td>
        </tr>
        <tr>
            <td><label for="date">Reservation Date:</label></td>
            <td>
                <input type="date" id="date" name="date">
            </td>
        </tr>
        <tr>
            <td><label for="time">Preferred Time:</label></td>
            <td>
                <input type="time" id="time" name="time">
            </td>
        </tr>
        <tr>
            <td><label for="table">Table Preference:</label></td>
            <td>
                <select id="table" name="table">
                    <option>Indoor</option>
                    <option>Outdoor</option>
                    <option>Family Table</option>
                    <option>Traditional Floor Seating</option>
                </select>
            </td>
        </tr>
        <tr>
            <td><label for="request">Special Request:</label></td>
            <td>
                <textarea id="request" name="request" rows="4"></textarea>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <button type="submit">Reserve Table</button>
            </td>
        </tr>
    </table>
</form>
<br>
   <img src="reserve.jpg" alt="reservation table" height="200x" width="300px">
        </div>
    </center>
</body>
</html>
